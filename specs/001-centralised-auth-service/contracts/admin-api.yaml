openapi: 3.1.0
info:
  title: Auth Service — Admin API
  version: 1.0.0
  description: |
    Admin endpoints for user management, access grant/revoke, and audit log.
    All endpoints require a valid JWT with `"admin"` in the `grants` claim.

servers:
  - url: http://localhost:8000
    description: Local development

security:
  - bearerAuth: []

tags:
  - name: users
    description: User listing and detail
  - name: grants
    description: Per-application access management
  - name: audit
    description: Immutable audit log

paths:

  /admin/users:
    get:
      tags: [users]
      summary: List all users (paginated)
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
        - name: q
          in: query
          schema: { type: string }
          description: Search by display name or email
      responses:
        "200":
          description: Paginated user list
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/UserSummary" }
                  total:
                    type: integer
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/users/{userId}:
    get:
      tags: [users]
      summary: Get user detail with grants and identity providers
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: User detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/grants:
    post:
      tags: [grants]
      summary: Grant a user access to an application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, app_name]
              properties:
                user_id:
                  type: string
                  format: uuid
                app_name:
                  type: string
                  example: budget-site
                role:
                  type: string
                  enum: [user, admin]
                  default: user
      responses:
        "201":
          description: Grant created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppGrant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Grant already exists
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /admin/grants/{grantId}:
    patch:
      tags: [grants]
      summary: Revoke a user's access to an application (soft-delete)
      description: |
        Sets `is_active = false` on the grant record. The record is retained for
        audit purposes. The unique constraint on `(user_id, app_name)` is enforced
        on active grants only — a previously revoked grant may be re-activated via
        `POST /admin/grants` which will reuse or replace the existing record.
        The revocation takes effect at the user's next token refresh (≤ 15 min TTL).
      parameters:
        - name: grantId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [is_active]
              properties:
                is_active:
                  type: boolean
                  enum: [false]
                  description: Must be false — this endpoint is used for revocation only
      responses:
        "200":
          description: Grant revoked (soft-deleted)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppGrant" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/users/{userId}/revoke-sessions:
    post:
      tags: [users]
      summary: Emergency revocation — invalidate all active sessions for a user
      description: |
        Marks all refresh tokens for the user as revoked and deletes the corresponding
        Redis keys. The user's current access tokens remain valid until their TTL
        (≤ 15 min). For immediate full revocation, rotate the JWT signing key.
        An audit event of type `token_revoked_all` is written.
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: All sessions revoked
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/audit:
    get:
      tags: [audit]
      summary: List audit events (paginated, newest first)
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
        - name: user_id
          in: query
          schema: { type: string, format: uuid }
          description: Filter by target user
        - name: app_name
          in: query
          schema: { type: string }
          description: Filter by app
        - name: action_type
          in: query
          schema: { type: string }
          description: Filter by action type
      responses:
        "200":
          description: Paginated audit log
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AuditEvent" }
                  total:
                    type: integer
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

components:
  schemas:
    UserSummary:
      type: object
      required: [id, display_name, is_active, created_at, grants]
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        grants:
          type: array
          items: { $ref: "#/components/schemas/AppGrant" }
        identity_providers:
          type: array
          items: { $ref: "#/components/schemas/IdentityProviderSummary" }

    UserDetail:
      allOf:
        - $ref: "#/components/schemas/UserSummary"
      type: object
      properties:
        recent_events:
          type: array
          items: { $ref: "#/components/schemas/AuditEvent" }
          description: Last 10 audit events for this user

    AppGrant:
      type: object
      required: [id, user_id, app_name, role, granted_at, is_active]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        app_name:
          type: string
        role:
          type: string
          enum: [user, admin]
        granted_at:
          type: string
          format: date-time
        is_active:
          type: boolean
        granted_by_display_name:
          type: string
          nullable: true

    IdentityProviderSummary:
      type: object
      required: [provider, email, created_at]
      properties:
        provider:
          type: string
          enum: [google, microsoft, local]
        email:
          type: string
          format: email
        created_at:
          type: string
          format: date-time

    AuditEvent:
      type: object
      required: [id, action_type, created_at]
      properties:
        id:
          type: string
          format: uuid
        actor_user_id:
          type: string
          format: uuid
          nullable: true
        actor_display_name:
          type: string
          nullable: true
        action_type:
          type: string
          enum:
            - user_created
            - user_deactivated
            - grant_created
            - grant_revoked
            - login_success
            - login_failed
            - token_revoked_all
        target_user_id:
          type: string
          format: uuid
          nullable: true
        target_user_display_name:
          type: string
          nullable: true
        target_app:
          type: string
          nullable: true
        metadata:
          type: object
          nullable: true
        created_at:
          type: string
          format: date-time

    Error:
      type: object
      required: [error, message]
      properties:
        error: { type: string }
        message: { type: string }

  responses:
    Unauthorized:
      description: Missing or invalid JWT
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Valid JWT but admin role required
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: RS256 JWT with "admin" in grants[] claim
