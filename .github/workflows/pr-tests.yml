name: PR Tests

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: auth_test
          POSTGRES_USER: auth_user
          POSTGRES_PASSWORD: auth_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U auth_user -d auth_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install --no-cache-dir ".[dev]"

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://auth_user:auth_pass@localhost:5432/auth_test
          REDIS_URL: redis://localhost:6379/0
        run: |
          openssl genrsa -out /tmp/test_private.pem 2048
          openssl rsa -in /tmp/test_private.pem -pubout -out /tmp/test_public.pem
          export JWT_PRIVATE_KEY="$(cat /tmp/test_private.pem)"
          export JWT_PUBLIC_KEY="$(cat /tmp/test_public.pem)"
          alembic upgrade head
          pytest -q --tb=short -m integration

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  status-check:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    name: All Tests Status

    steps:
      - name: All tests passed
        run: echo "✅ All tests passed. PR is ready for review."
